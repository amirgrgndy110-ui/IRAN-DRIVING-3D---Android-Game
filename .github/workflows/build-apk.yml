
name: IRAN DRIVING 3D APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p game
          unzip -q IRAN_DRIVING_3D_Full_Upgrade_v0.3.zip -d game

      - name: Find Unity project
        id: project
        run: |
          FILE=$(find game -name ProjectVersion.txt -path '*/ProjectSettings/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Unity project not found in ZIP"
            exit 1
          fi
          DIR=$(dirname "$(dirname "$FILE")")
          echo "path=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ steps.project.outputs.path }}
          targetPlatform: Android
          buildsPath: build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAN-DRIVING-3D-APK
          path: build/**/*.apk
          if-no-files-found: error
