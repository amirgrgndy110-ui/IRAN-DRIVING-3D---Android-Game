
name: IRAN DRIVING 3D APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Game ZIP
        run: |
          mkdir extracted
          unzip -q IRAN_DRIVING_3D_Full_Upgrade_v0.3.zip -d extracted

      - name: Check Unity Project
        run: |
          PROJECT="extracted/IRAN_DRIVING_3D_Project"
          if [ ! -f "$PROJECT/ProjectSettings/ProjectVersion.txt" ]; then
            echo "Unity ProjectSettings/ProjectVersion.txt is missing!"
            echo "A complete Unity project is required."
            exit 1
          fi

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: extracted/IRAN_DRIVING_3D_Project
          targetPlatform: Android
          buildMethod: ''
          buildsPath: build
          versioning: None

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRAN-DRIVING-3D-APK
          path: build/**/*.apk
